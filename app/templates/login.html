<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            border-radius: 10px;
            background: #fff;
        }
    </style>
</head>
<body class="bg-light">
    <div class="login-box">
        <h2 class="text-center">Ticketing Tool Login</h2>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">Login</button>
            <div class="text-center mt-3">
                <a href="#" onclick="showSupport()">Forgot Password?</a>
            </div>
        </form>
        <div id="supportInfo" class="alert alert-info mt-3 d-none text-center">
            IT Helpline: 8108271708
        </div>
    </div>

    <script>
        function showSupport() {
            document.getElementById("supportInfo").classList.remove("d-none");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Ticket Dashboard</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <a href="/create" class="btn btn-success my-3">Create New Ticket</a>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Ticket ID</th>
                <th>Customer</th>
                <th>Email</th>
                <th>Issue</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for ticket in tickets %}
            <tr>
                <td>{{ ticket.id }}</td>
                <td>{{ ticket.customer_name }}</td>
                <td>{{ ticket.email }}</td>
                <td>{{ ticket.issue_title }}</td>
                <td>{{ ticket.status }}</td>
                <td>{{ ticket.assigned_to }}</td>
                <td>
                    <a href="/edit/{{ ticket.id }}" class="btn btn-sm btn-primary">Edit</a>
                    <a href="/delete/{{ ticket.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this ticket?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Edit Ticket #{{ ticket.id }}</h2>
    <form method="post" action="/edit/{{ ticket.id }}">
        <div class="mb-2">
            <label>Customer Name</label>
            <input type="text" name="customer_name" class="form-control" value="{{ ticket.customer_name }}" required>
        </div>
        <div class="mb-2">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ ticket.email }}" required>
        </div>
        <div class="mb-2">
            <label>Contact Number</label>
            <input type="text" name="contact" class="form-control" value="{{ ticket.contact }}" required>
        </div>
        <div class="mb-2">
            <label>Issue Title</label>
            <input type="text" name="issue_title" class="form-control" value="{{ ticket.issue_title }}" required>
        </div>
        <div class="mb-2">
            <label>Description</label>
            <textarea name="description" class="form-control" required>{{ ticket.description }}</textarea>
        </div>
        <div class="mb-2">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="New" {% if ticket.status == 'New' %}selected{% endif %}>New</option>
                <option value="Pending" {% if ticket.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Closed" {% if ticket.status == 'Closed' %}selected{% endif %}>Closed</option>
            </select>
        </div>
        <div class="mb-2">
            <label>Assigned To</label>
            <select name="assigned_to" class="form-control">
                <option value="Aniket" {% if ticket.assigned_to == 'Aniket' %}selected{% endif %}>Aniket</option>
                <option value="Shameer" {% if ticket.assigned_to == 'Shameer' %}selected{% endif %}>Shameer</option>
                <option value="Siddhi" {% if ticket.assigned_to == 'Siddhi' %}selected{% endif %}>Siddhi</option>
            </select>
        </div>
        <div class="mb-2">
            <label>Priority</label>
            <select name="priority" class="form-control">
                <option value="Low" {% if ticket.priority == 'Low' %}selected{% endif %}>Low</option>
                <option value="Medium" {% if ticket.priority == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="High" {% if ticket.priority == 'High' %}selected{% endif %}>High</option>
            </select>
        </div>
        <div class="mb-2">
            <label>Category</label>
            <select name="category" class="form-control">
                <option value="Technical Support" {% if ticket.category == 'Technical Support' %}selected{% endif %}>Technical Support</option>
                <option value="Customer Support" {% if ticket.category == 'Customer Support' %}selected{% endif %}>Customer Support</option>
            </select>
        </div>
        <button class="btn btn-primary">Update Ticket</button>
    </form>
</body>
</html>
